<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Video Player</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      max-width: 100vw;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="player" controls autoplay>
    <source src="http://100.64.0.2:8080/stream.mp4" type="video/mp4">
    Trình duyệt của bạn không hỗ trợ video.
  </video>
</body>
</html>
