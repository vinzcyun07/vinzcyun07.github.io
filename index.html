<!DOCTYPE html>
<html>
  <body>
    <div id="container">Đang giải mã...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
      async function decryptAndRender() {
        const ciphertext = "qqoY4gRlHErmO1WVgrHBKxZWkdrO/cE+BpPvFExVs3fxqDotp/psGwp6hXSRXvfKpURA+TMAxbbWvj/NKdW7DHiEsAHL9BGPBP+M4u5XhaXGXVUE2YnmTUsxazAhqeEo70GtCjgnRbE6JnBQXt8pgT+iMFSK";
        const nonce = "fQLCbRrSSODpaObNfm1YPg==";
        const tag = "SPb2qEc4USSbLZ9h+tLkLQ==";
        const key = "0+yfgf5RcUtnvBLYjPak9w==";

        const keyBytes = CryptoJS.enc.Base64.parse(key);
        const nonceBytes = CryptoJS.enc.Base64.parse(nonce);
        const tagBytes = CryptoJS.enc.Base64.parse(tag);
        const ctBytes = CryptoJS.enc.Base64.parse(ciphertext);

        // CryptoJS không hỗ trợ AES-GCM -> cần dùng Web Crypto API
        const cryptoKey = await crypto.subtle.importKey(
          "raw", Uint8Array.from(atob(key), c => c.charCodeAt(0)),
          "AES-GCM", false, ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: Uint8Array.from(atob(nonce), c => c.charCodeAt(0)),
            tagLength: 128
          },
          cryptoKey,
          Uint8Array.from(atob(ciphertext), c => c.charCodeAt(0))
        );

        const decoder = new TextDecoder();
        document.getElementById("container").innerHTML = decoder.decode(decrypted);
      }

      decryptAndRender().catch(err => {
        document.getElementById("container").innerText = "Lỗi giải mã: " + err;
      });
    </script>
  </body>
</html>
